name: Build Easkoy Image


on:

  push:

    branches:
      - main

  workflow_dispatch:



permissions:

  contents: read

  packages: write



jobs:


  docker:


    name: Build and Push GHCR


    runs-on: ubuntu-latest


    steps:


      - name: Checkout Repository

        uses: actions/checkout@v5



      - name: Setup QEMU

        uses: docker/setup-qemu-action@v3



      - name: Setup Docker Buildx

        uses: docker/setup-buildx-action@v3



      - name: Login GHCR


        uses: docker/login-action@v3


        with:

          registry: ghcr.io

          username: ${{ github.actor }}

          password: ${{ secrets.GITHUB_TOKEN }}



      - name: Read Version


        id: version

        run: |

          echo "VERSION=$(cat VERSION)" >> $GITHUB_OUTPUT



      - name: Build and Push


        uses: docker/build-push-action@v5


        with:

          context: .


          platforms:

            linux/amd64


          push: true


          tags:


            ghcr.io/${{ github.repository_owner }}/easkoy:latest

            ghcr.io/${{ github.repository_owner }}/easkoy:${{ steps.version.outputs.VERSION }}
