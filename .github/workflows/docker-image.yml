name: Build Easkoy Image


on:

  push:

    branches:
      - main

  workflow_dispatch:



permissions:

  contents: read

  packages: write



jobs:


  build:


    runs-on: ubuntu-latest


    steps:


    - name: Checkout

      uses: actions/checkout@v4



    - name: Login GHCR

      uses: docker/login-action@v3

      with:

        registry: ghcr.io

        username: ${{ github.actor }}

        password: ${{ secrets.GITHUB_TOKEN }}



    - name: Build Image


      uses: docker/build-push-action@v5

      with:

        context: .

        push: true

        platforms: linux/amd64

        tags:

          ghcr.io/${{ github.repository_owner }}/easkoy:latest
