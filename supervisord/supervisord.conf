[supervisord]
nodaemon=true

[program:singbox]
command=/usr/local/bin/sing-box run -c /app/config/config.json
autorestart=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr

[program:cloudflared]

command=/bin/sh -c '/usr/local/bin/cloudflared tunnel run --token ${TUNNEL_TOKEN}'


autostart=false
autorestart=false
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr

