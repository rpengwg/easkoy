[supervisord]
nodaemon=true

[program:singbox]
command=/usr/local/bin/sing-box run -c /app/config/config.json
autorestart=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr

[program:cloudflared]
command=/usr/local/bin/cloudflared tunnel run --token %(ENV_TUNNEL_TOKEN)s
autorestart=true
autostart=false
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
